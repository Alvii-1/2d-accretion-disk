<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>2D Accrection Disk</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { color: #ffcc00; margin-bottom: 10px; }
        canvas { border: 1px solid #333; }
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        label { font-size: 12px; color: #aaa; }
        input[type="range"] { width: 150px; }
        button {
            background: #ffcc00;
            color: black;
            border: none;
            padding: 8px 20px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>2D Accretion disk</h1>
    <canvas id="webgpu-canvas" width="1200" height="800"></canvas>
    <div class="controls">
        <div class="control-group">
            <label>Body Count: <span id="countVal">500</span></label>
            <input type="range" id="bodyCount" min="10" max="10000" value="500">
        </div>
        <div class="control-group">
            <label>Mass Variance: <span id="varianceVal">1e6</span></label>
            <input type="range" id="massVariance" min="0" max="10" value="5">
        </div>
        <div class="control-group">
            <label>Min Orbit Radius: <span id="minRadVal">80</span></label>
            <input type="range" id="minRadius" min="40" max="200" value="80">
        </div>
        <div class="control-group">
            <label>Max Orbit Radius: <span id="maxRadVal">300</span></label>
            <input type="range" id="maxRadius" min="100" max="5000" value="300">
        </div>
        <div class="control-group">
            <label>Zoom: <span id="zoomVal">1.0</span></label>
            <input type="range" id="zoom" min="1" max="20" value="1" step="0.5">
        </div>
        <div class="control-group">
            <label>Speed Multiplier: <span id="speedVal">1</span>x</label>
            <input type="range" id="speedMultiplier" min="1" max="20" value="1" step="1">
        </div>
        <div class="control-group">
            <label>Secondary Mass:</label>
            <input type="number" id="secondaryMass" value="5e9" style="width:80px; background:#222; color:white; border:1px solid #444; font-family:monospace; padding:4px;">
        </div>
        <div class="control-group">
            <button id="insertBtn">Insert Mass Mode</button>
        </div>
        <button id="generateBtn">Generate</button>
    </div>
</body>
</html>
